[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wumpus-world"
version = "0.1.0"
description = "Minecraft-themed Wumpus World puzzle game built with tkinter"
readme = "README.md"
requires-python = ">=3.7"
authors = [{ name = "Mandy98438" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Puzzle Games",
]

[project.urls]
Homepage = "https://github.com/Mandy98438/wumpus-world"

[project.scripts]
wumpus-world = "wumpus_world.game:main"

[tool.setuptools]
packages = ["wumpus_world"]
